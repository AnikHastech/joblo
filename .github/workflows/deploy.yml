# GitHub Actions — build check on every push + PR.
#
# The actual production deployment is handled by whichever host you connect
# the repo to (Cloudflare Pages / Vercel / Netlify / Render — see README).
# This workflow just verifies the build succeeds so a broken commit can't
# ship without a warning first.
#
# Want auto-deploy to GitHub Pages instead? Uncomment the `deploy` job below
# and enable Pages under Settings → Pages → Source: GitHub Actions.

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build

